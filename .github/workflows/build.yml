name: Build and release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without "v" (for example, 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build plugin
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select plugin version
        id: version
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
              $defaultRef = "refs/heads/$env:DEFAULT_BRANCH"
              if ($env:WORKFLOW_REF -ne $defaultRef) {
                  throw "Releases must run from the default branch ($env:DEFAULT_BRANCH)."
              }

              $version = $env:REQUESTED_VERSION.Trim()
              if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
                  throw "Version must use X.Y.Z syntax without a leading v."
              }
          }
          else {
              $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }

          "PLUGIN_VERSION=$version" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Download verified Fan Control V272 references
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "FanControl_272_net_10_0.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "FanControl_272_net_10_0"
          $uri = "https://github.com/Rem0o/FanControl.Releases/releases/download/V272/FanControl_272_net_10_0.zip"
          $expectedHash = "5f84c3514b213ea040051c595f1915d9c75e3b5f1c9d7b9b39353f6bbbcd2b80"

          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw "Fan Control archive checksum mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $pluginApi = Join-Path $extractDir "FanControl.Plugins.dll"
          if (-not (Test-Path -LiteralPath $pluginApi)) {
              throw "FanControl.Plugins.dll was not found in the verified archive."
          }
          "FANCONTROL_DIR=$extractDir" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build .\FanControl.MinisforumUM780XTX.csproj `
              --configuration Release `
              "-p:FanControlDir=$env:FANCONTROL_DIR" `
              "-p:Version=$env:PLUGIN_VERSION" `
              -p:ContinuousIntegrationBuild=true

      - name: Verify plugin version
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE `
              "bin\Release\net10.0-windows\FanControl.MinisforumUM780XTX.dll"
          if (-not (Test-Path -LiteralPath $plugin)) {
              throw "Built plugin DLL was not found: $plugin"
          }

          $versionCore = ($env:PLUGIN_VERSION -split '-', 2)[0]
          $expectedBinaryVersion = "$versionCore.0"
          $assemblyVersion =
              [Reflection.AssemblyName]::GetAssemblyName($plugin).Version.ToString()
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($plugin)

          if ($assemblyVersion -ne $expectedBinaryVersion) {
              throw "Assembly version is $assemblyVersion; expected $expectedBinaryVersion."
          }
          if ($versionInfo.FileVersion -ne $expectedBinaryVersion) {
              throw "File version is $($versionInfo.FileVersion); expected $expectedBinaryVersion."
          }
          if ($versionInfo.ProductVersion -ne $env:PLUGIN_VERSION) {
              throw "Product version is $($versionInfo.ProductVersion); expected $env:PLUGIN_VERSION."
          }

      - name: Package plugin
        shell: pwsh
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP "release-assets"
          $sourceDll = Join-Path $env:GITHUB_WORKSPACE `
              "bin\Release\net10.0-windows\FanControl.MinisforumUM780XTX.dll"
          $archive = Join-Path $assetDir "FanControl.MinisforumUM780XTX.zip"

          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          Compress-Archive -LiteralPath $sourceDll -DestinationPath $archive -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
              if ($zip.Entries.Count -ne 1 -or
                  $zip.Entries[0].FullName -ne "FanControl.MinisforumUM780XTX.dll") {
                  throw "Plugin archive must contain exactly one root-level DLL."
              }
          }
          finally {
              $zip.Dispose()
          }

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FanControl.MinisforumUM780XTX-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release-assets/FanControl.MinisforumUM780XTX.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: FanControl.MinisforumUM780XTX-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $releaseTag = "v$env:RELEASE_VERSION"
          $escapedTag = [Uri]::EscapeDataString($releaseTag)
          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $response = Invoke-WebRequest `
              -Uri "https://api.github.com/repos/$env:GH_REPO/git/ref/tags/$escapedTag" `
              -Headers $headers `
              -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
              throw "Tag $releaseTag already exists. Choose a new version."
          }
          if ($response.StatusCode -ne 404) {
              throw "Could not verify that tag $releaseTag is unused (HTTP $($response.StatusCode))."
          }

          gh release create $releaseTag `
              .\release-assets\FanControl.MinisforumUM780XTX.zip `
              --repo $env:GH_REPO `
              --target $env:RELEASE_TARGET `
              --title $releaseTag `
              --generate-notes
