name: Build and release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without "v" (for example, 4.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    outputs:
      publish_release: ${{ steps.version.outputs.publish_release }}
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select plugin version
        id: version
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
              $defaultRef = "refs/heads/$env:DEFAULT_BRANCH"
              if ($env:WORKFLOW_REF -ne $defaultRef) {
                  throw "Releases must run from the default branch ($env:DEFAULT_BRANCH)."
              }

              $version = $env:REQUESTED_VERSION.Trim()
              if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
                  throw "Version must use X.Y.Z syntax without a leading v, for example 4.1.0."
              }
              $publishRelease = "true"
          }
          else {
              $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
              $publishRelease = "false"
          }

          "PLUGIN_VERSION=$version" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "publish_release=$publishRelease" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_version=$version" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download verified FanControl V272 references
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "FanControl_272_net_10_0.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "FanControl_272_net_10_0"
          $uri = "https://github.com/Rem0o/FanControl.Releases/releases/download/V272/FanControl_272_net_10_0.zip"
          $expectedHash = "5f84c3514b213ea040051c595f1915d9c75e3b5f1c9d7b9b39353f6bbbcd2b80"

          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw "FanControl archive checksum mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $pluginApi = Get-ChildItem -LiteralPath $extractDir -Recurse -File -Filter "FanControl.Plugins.dll" |
              Select-Object -First 1
          if ($null -eq $pluginApi) {
              throw "FanControl.Plugins.dll was not found in the verified archive."
          }
          "FANCONTROL_DIR=$($pluginApi.Directory.FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build .\FanControl.MinisforumUM780XTX.csproj `
              --configuration Release `
              "-p:FanControlDir=$env:FANCONTROL_DIR" `
              "-p:Version=$env:PLUGIN_VERSION" `
              -p:ContinuousIntegrationBuild=true

      - name: Build diagnostic helpers
        shell: pwsh
        run: |
          $projects = @(
              ".\diagnostics\FanControl.MinisforumUM780XTX.Diagnostics.csproj",
              ".\diagnostics\FanControlIpc\FanControlIpc.csproj",
              ".\diagnostics\CpuBurn\CpuBurn.csproj",
              ".\diagnostics\IsaMutexFault\IsaMutexFault.csproj"
          )
          foreach ($project in $projects) {
              dotnet build $project `
                  --configuration Release `
                  "-p:FanControlDir=$env:FANCONTROL_DIR" `
                  "-p:Version=$env:PLUGIN_VERSION" `
                  -p:ContinuousIntegrationBuild=true
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

      - name: Validate diagnostics and curated evidence
        shell: pwsh
        run: |
          $scripts = Get-ChildItem .\diagnostics -Recurse -File -Filter "*.ps1"
          foreach ($script in $scripts) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $script.FullName,
                  [ref]$tokens,
                  [ref]$errors)
              if ($errors.Count -ne 0) {
                  $messages = $errors.Message -join "; "
                  throw "$($script.FullName): $messages"
              }
          }

          $results = Get-ChildItem `
              .\diagnostics\hardware-results `
              -Recurse -File -Filter "RESULTS.json"
          foreach ($result in $results) {
              Get-Content -LiteralPath $result.FullName -Raw |
                  ConvertFrom-Json |
                  Out-Null
          }

      - name: Run hardware-free tests
        shell: pwsh
        run: |
          dotnet run `
              --project .\tests\FanControl.MinisforumUM780XTX.Tests.csproj `
              --configuration Release `
              "-p:FanControlDir=$env:FANCONTROL_DIR" `
              "-p:Version=$env:PLUGIN_VERSION" `
              -p:ContinuousIntegrationBuild=true

      - name: Verify plugin version
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE `
              "bin\Release\net10.0-windows\FanControl.MinisforumUM780XTX.dll"
          if (-not (Test-Path -LiteralPath $plugin)) {
              throw "Built plugin DLL was not found: $plugin"
          }

          $versionCore = ($env:PLUGIN_VERSION -split '-', 2)[0]
          $expectedBinaryVersion = "$versionCore.0"
          $assemblyVersion =
              [Reflection.AssemblyName]::GetAssemblyName($plugin).Version.ToString()
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($plugin)

          if ($assemblyVersion -ne $expectedBinaryVersion) {
              throw "Assembly version is $assemblyVersion; expected $expectedBinaryVersion."
          }
          if ($versionInfo.FileVersion -ne $expectedBinaryVersion) {
              throw "File version is $($versionInfo.FileVersion); expected $expectedBinaryVersion."
          }
          if ($versionInfo.ProductVersion -ne $env:PLUGIN_VERSION) {
              throw "Product version is $($versionInfo.ProductVersion); expected $env:PLUGIN_VERSION."
          }

          Write-Host "Verified plugin version $env:PLUGIN_VERSION."

      - name: Package plugin
        shell: pwsh
        run: |
          $assetDir = Join-Path $PWD "release-assets"
          $stagingDir = Join-Path $env:RUNNER_TEMP "FanControl.MinisforumUM780XTX"
          $sourceDll = Join-Path $PWD "bin\Release\net10.0-windows\FanControl.MinisforumUM780XTX.dll"
          $archive = Join-Path $assetDir "FanControl.MinisforumUM780XTX.zip"

          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item -LiteralPath $sourceDll -Destination $stagingDir
          Compress-Archive -Path (Join-Path $stagingDir "FanControl.MinisforumUM780XTX.dll") `
              -DestinationPath $archive -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
              if ($zip.Entries.Count -ne 1 -or
                  $zip.Entries[0].FullName -ne "FanControl.MinisforumUM780XTX.dll") {
                  throw "Plugin archive must contain exactly one root-level DLL."
              }
          }
          finally {
              $zip.Dispose()
          }

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: FanControl.MinisforumUM780XTX
          path: release-assets/FanControl.MinisforumUM780XTX.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.publish_release == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin ZIP
        uses: actions/download-artifact@v8
        with:
          name: FanControl.MinisforumUM780XTX
          path: release-assets

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          $releaseZip = (Get-Item -LiteralPath `
              .\release-assets\FanControl.MinisforumUM780XTX.zip).FullName
          $releaseTag = "v$env:RELEASE_VERSION"
          $escapedTag = [Uri]::EscapeDataString($releaseTag)
          $tagCheck = & gh api `
              "repos/$env:GH_REPO/git/ref/tags/$escapedTag" `
              --silent 2>&1
          if ($LASTEXITCODE -eq 0) {
              throw "Tag $releaseTag already exists. Choose a new version."
          }
          if (($tagCheck | Out-String) -notmatch '404') {
              throw "Could not verify that tag $releaseTag is unused: $tagCheck"
          }

          gh release create $releaseTag $releaseZip `
              --target $env:RELEASE_TARGET `
              --title $releaseTag `
              --generate-notes
